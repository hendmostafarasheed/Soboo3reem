<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a9d7f3">
  <title>تفاصيل دعوة سبوع ريم الشرنوبي</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="invitation-shell" aria-label="تفاصيل دعوة سبوع ريم الشرنوبي">
    <div class="artwork page-two">
      <img class="invitation-art" src="assets/invitation-page-2.png" alt="تفاصيل موعد ومكان سبوع ريم الشرنوبي">
      <div class="bubble-layer" aria-hidden="true"></div>

      <!-- المناطق التفاعلية فوق الأزرار المرسومة في التصميم -->
      <a class="hotspot maps-hotspot" href="https://www.google.com/maps/search/?api=1&query=White%20Plaza%20Askar%20Group" target="_blank" rel="noopener noreferrer" aria-label="فتح المكان على خرائط جوجل"></a>
      <button class="hotspot confirm-hotspot" type="button" data-action="confirm" aria-label="تأكيد الحضور عبر واتساب"></button>
      <button class="hotspot share-hotspot" type="button" data-action="share" aria-label="مشاركة الدعوة"></button>
      <a class="back-link" href="index.html" aria-label="الرجوع إلى الصفحة الأولى">‹</a>
    </div>
  </main>
  <div class="white-flash" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
